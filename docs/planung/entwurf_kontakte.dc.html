<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kontakte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Archivo:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f6f8;font-family:Inter,system-ui,sans-serif;color:#10131a}
a{color:#424954;text-decoration:none}a:hover{color:#10131a}
.kachel{background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rolle{font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#636a74;background:#f1f3f6;border-radius:999px;padding:3px 8px;white-space:nowrap}
.nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zeile{display:flex;align-items:center;gap:6px;font-size:12px;color:#424954;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nz{font-size:12px;color:#636a74;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini{all:unset;cursor:pointer;width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#636a74;border:1px solid #e6e9ee}
.mini:hover{background:#f1f3f6;color:#10131a}
.feld{box-sizing:border-box;width:100%;height:30px;border:1px solid #e6e9ee;border-radius:8px;padding:0 10px;font:inherit;font-size:13px;background:#fff}
.feld:focus{outline:1px solid #10131a}
.btn{all:unset;cursor:pointer;height:32px;padding:0 14px;border-radius:999px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;display:inline-flex;align-items:center;gap:6px}
</style>
</helmet>

<div style="max-width: 1360px; margin: 0 auto; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: baseline; gap: 14px">
    <h1 style="margin: 0; font-family: Archivo, Inter, sans-serif; font-weight: 800; font-size: 22px">Kontakte</h1>
    <span style="font-size: 13px; color: #424954">{{anzahl}} Beteiligte</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px">
    <sc-for list="{{kontakte}}" as="k" hint-placeholder-count="5">
      <div class="kachel">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <div class="nm">{{k.name}}</div>
          <span class="rolle">{{k.rolle}}</span>
        </div>
        <sc-if value="{{k.hatTel}}" hint-placeholder-val="{{true}}">
          <a class="zeile" href="tel:{{k.tel}}"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2h2.2l1.1 3-1.5 1a8 8 0 0 0 3.7 3.7l1-1.5 3 1.1v2.2A1.5 1.5 0 0 1 11.5 13 9.5 9.5 0 0 1 2 3.5 1.5 1.5 0 0 1 3.5 2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path></svg>{{k.tel}}</a>
        </sc-if>
        <sc-if value="{{k.hatMail}}" hint-placeholder-val="{{true}}">
          <a class="zeile" href="mailto:{{k.mail}}"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.5" width="12" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"></rect><path d="M2.5 4.5L8 9l5.5-4.5" fill="none" stroke="currentColor" stroke-width="1.3"></path></svg>{{k.mail}}</a>
        </sc-if>
        <sc-if value="{{k.hatNotiz}}" hint-placeholder-val="{{false}}"><div class="nz">{{k.notiz}}</div></sc-if>
        <div style="display: flex; gap: 6px; margin-top: auto; padding-top: 4px">
          <button type="button" class="mini" aria-label="Bearbeiten" title="Bearbeiten"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13l1-3.5L10.5 3 13 5.5 6.5 12z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path></svg></button>
          <button type="button" class="mini" aria-label="Entfernen" title="Entfernen" onClick="{{k.entfernen}}"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg></button>
        </div>
      </div>
    </sc-for>

    <sc-if value="{{formZu}}" hint-placeholder-val="{{true}}">
      <button type="button" onClick="{{oeffnen}}" style="all: unset; cursor: pointer; border: 1.5px dashed #ccd2db; border-radius: 14px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #424954; font-size: 13px; font-weight: 600">
        <span style="font-size: 22px; line-height: 1">+</span>Kontakt hinzufügen
      </button>
    </sc-if>
    <sc-if value="{{formOffen}}" hint-placeholder-val="{{false}}">
      <div class="kachel" style="border-color: #10131a; gap: 8px">
        <label><span style="position: absolute; left: -9999px">Name</span><input class="feld" placeholder="Name / Firma" value="{{neu.name}}" onChange="{{neu.setName}}"></label>
        <label><span style="position: absolute; left: -9999px">Rolle</span>
          <select class="feld" value="{{neu.rolle}}" onChange="{{neu.setRolle}}">
            <option value="Makler">Makler</option><option value="Eigentümer">Eigentümer</option><option value="Verwalter">Verwalter</option><option value="Notar">Notar</option><option value="Handwerker">Handwerker</option><option value="Sonstige">Sonstige</option>
          </select>
        </label>
        <label><span style="position: absolute; left: -9999px">Telefon</span><input class="feld" placeholder="Telefon" value="{{neu.tel}}" onChange="{{neu.setTel}}"></label>
        <label><span style="position: absolute; left: -9999px">E-Mail</span><input class="feld" placeholder="E-Mail" value="{{neu.mail}}" onChange="{{neu.setMail}}"></label>
        <div style="display: flex; gap: 6px">
          <button type="button" class="btn" style="background: #10131a; color: #fff" onClick="{{speichern}}">Speichern</button>
          <button type="button" class="btn" style="color: #424954; border: 1px solid #e6e9ee" onClick="{{abbrechen}}">Abbrechen</button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":560}}'>
var START=[
 {name:'Brandt & Partner, Herr Ostermann',rolle:'Makler',tel:'0731 0000004',mail:'ostermann@beispiel.de',notiz:'Hat noch 2 weitere WHG am Eselsberg in Aussicht.'},
 {name:'Hausgemeinschaft Rebhangweg GbR',rolle:'Eigentümer',tel:'',mail:'',notiz:''},
 {name:'Verwalter Feldhaus',rolle:'Verwalter',tel:'0731 0000005',mail:'',notiz:'Protokolle 2023/24 zugesagt.'},
 {name:'Notariat Dr. Beispiel',rolle:'Notar',tel:'0731 0000006',mail:'kanzlei@beispiel.de',notiz:''}
];
class Component extends DCLogic {
  constructor(p){ super(p); this.state={ k:START.slice(), offen:false, neu:{name:'',rolle:'Makler',tel:'',mail:''} }; }
  renderVals(){
    var self=this, s=this.state;
    function setN(f){ return function(e){ var n=Object.assign({},self.state.neu); n[f]=e.target.value; self.setState({neu:n}); }; }
    return {
      anzahl:s.k.length,
      kontakte:s.k.map(function(k,i){ return Object.assign({},k,{hatTel:!!k.tel,hatMail:!!k.mail,hatNotiz:!!k.notiz,
        entfernen:function(){ var a=self.state.k.slice(); a.splice(i,1); self.setState({k:a}); }}); }),
      formOffen:s.offen, formZu:!s.offen,
      oeffnen:function(){ self.setState({offen:true}); },
      abbrechen:function(){ self.setState({offen:false}); },
      speichern:function(){ var n=self.state.neu; if(!n.name.trim()) return; self.setState({k:self.state.k.concat([Object.assign({notiz:''},n)]), offen:false, neu:{name:'',rolle:'Makler',tel:'',mail:''}}); },
      neu:Object.assign({},s.neu,{setName:setN('name'),setRolle:setN('rolle'),setTel:setN('tel'),setMail:setN('mail')})
    };
  }
}
</script>
</body>
</html>
