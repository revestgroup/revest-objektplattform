<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Checkliste Ankauf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Archivo:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f6f8;font-family:Inter,system-ui,sans-serif;color:#10131a}
a{color:#424954}a:hover{color:#10131a}
.karte{background:#fff;border:1px solid #e6e9ee;border-radius:18px;overflow:hidden}
.sek{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#636a74;font-weight:600;padding:12px 12px 8px;display:flex;justify-content:space-between}
.r{display:grid;align-items:center;min-height:32px;border-top:1px solid #eef0f3;font-size:13px;column-gap:8px;padding:0 12px}
.ru{grid-template-columns:22px 24px minmax(0,1fr) auto}
.rp{grid-template-columns:22px 24px minmax(0,1fr) 30px minmax(0,0.9fr)}
.nr{font-size:11px;color:#8a9099;font-variant-numeric:tabular-nums;text-align:right}
.haken{all:unset;box-sizing:border-box;width:20px;height:20px;border-radius:999px;border:1.5px solid #ccd2db;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff}
.haken.an{background:#17935c;border-color:#17935c}
.haken.krit{background:#cf4848;border-color:#cf4848}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name.erl{color:#636a74}
.pfl{font-size:9px;letter-spacing:.12em;color:#8a5a08;font-weight:600;margin-left:6px}
.seg{display:flex;background:#f1f3f6;border-radius:999px;padding:2px}
.seg button{all:unset;cursor:pointer;font-size:11px;padding:3px 9px;border-radius:999px;color:#636a74;white-space:nowrap}
.seg button.f{background:#fbe2e2;color:#9a2727;font-weight:600}
.seg button.a{background:#fbebd1;color:#8a5a08;font-weight:600}
.seg button.l{background:#dbf2e6;color:#0c5e3a;font-weight:600}
.krbtn{all:unset;cursor:pointer;width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#a3abb8}
.krbtn.an{background:#fbe2e2;color:#9a2727}
.notiz{all:unset;box-sizing:border-box;width:100%;height:24px;font-size:12px;color:#424954;border-radius:6px;padding:0 8px;background:#f5f6f8}
.notiz:focus{background:#fff;outline:1px solid #ccd2db}
</style>
</helmet>

<div style="max-width: 1360px; margin: 0 auto; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <h1 style="margin: 0; font-family: Archivo, Inter, sans-serif; font-weight: 800; font-size: 22px">Checkliste Ankauf</h1>
      <span style="font-size: 13px; color: #424954; font-variant-numeric: tabular-nums">{{erledigt}} von {{gesamt}} erledigt</span>
      <sc-if value="{{hatKritisch}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #9a2727; font-weight: 600">{{kritischText}}</span></sc-if>
    </div>
    <div style="flex: 0 1 320px; height: 6px; border-radius: 999px; background: #e6e9ee; overflow: hidden"><div style="height: 6px; background: #17935c; width: {{fortschritt}}"></div></div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">

    <div class="karte" style="flex: 1 1 560px; min-width: 0">
      <div class="sek"><span>Unterlagen</span><span>{{uErledigt}}</span></div>
      <sc-for list="{{unterlagen}}" as="u" hint-placeholder-count="10">
        <div class="r ru">
          <div class="nr">{{u.nr}}</div>
          <button type="button" class="haken {{u.hakenKlasse}}" aria-label="{{u.name}} liegt vor" onClick="{{u.abhaken}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-4.9" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          <div class="name {{u.nameKlasse}}">{{u.name}}<sc-if value="{{u.pflicht}}" hint-placeholder-val="{{false}}"><span class="pfl">PFLICHT</span></sc-if><span style="font-size: 11px; color: #8a9099; margin-left: 8px">{{u.datei}}</span></div>
          <div class="seg">
            <button type="button" class="{{u.kF}}" onClick="{{u.setF}}">fehlt</button>
            <button type="button" class="{{u.kA}}" onClick="{{u.setA}}">angefordert</button>
            <button type="button" class="{{u.kL}}" onClick="{{u.setL}}">liegt vor</button>
          </div>
        </div>
      </sc-for>
    </div>

    <div class="karte" style="flex: 1 1 560px; min-width: 0">
      <div class="sek"><span>Prüfpunkte</span><span>{{pErledigt}}</span></div>
      <sc-for list="{{punkte}}" as="p" hint-placeholder-count="8">
        <div class="r rp">
          <div class="nr">{{p.nr}}</div>
          <button type="button" class="haken {{p.hakenKlasse}}" aria-label="{{p.name}} geprüft" onClick="{{p.abhaken}}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-4.9" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          <div class="name {{p.nameKlasse}}">{{p.name}}</div>
          <button type="button" class="krbtn {{p.krKlasse}}" aria-label="{{p.name}} als kritisch markieren" title="Als kritisch markieren" onClick="{{p.kritisch}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.8l5.6 9.8H1.4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path><path d="M7 5.6v2.8M7 10v.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg></button>
          <label style="min-width: 0"><span style="position: absolute; left: -9999px">Notiz {{p.name}}</span><input class="notiz" placeholder="Notiz" value="{{p.notiz}}" onChange="{{p.setzeNotiz}}"></label>
        </div>
      </sc-for>
      <div style="font-size: 11px; color: #636a74; padding: 8px 12px 12px">Haken = geprüft und ok · Dreieck = kritisch (Haken wird rot, Warnung beim Ankauf)</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":720}}'>
var UNTERLAGEN=[["Grundbuchauszug",1,"l","Grundbuchauszug_Eselsberg.pdf"],["Teilungserklärung",1,"a",""],["Aufteilungsplan",0,"f",""],["WEG-Protokolle (3 Jahre)",1,"l","WEG_Protokoll_2025.pdf"],["Wirtschaftsplan",1,"a",""],["Hausgeld-Jahresabrechnung",1,"f",""],["Rücklagennachweis",0,"f",""],["Energieausweis",1,"l","Energieausweis.pdf"],["Grundriss",0,"l","Grundriss_OG1.pdf"],["Mietvertrag / Mieterliste",0,"l","Mietaufstellung_WG_Zimmer.xlsx"]];
var PUNKTE=[["Sonderumlagen beschlossen oder geplant","",""],["Höhe der Erhaltungsrücklage","ok","7.800 € für 24 Einheiten, eher knapp"],["Anstehende Beschlüsse / Maßnahmen","",""],["Hausgeld plausibel","ok","410 €/Monat"],["Stellplatz/TG mit eigenem Grundbuch","krit","nur Sondernutzungsrecht?"],["Mietverhältnis und Kündigungsfristen","ok","5 WG-Verträge, unbefristet"],["Denkmalschutz / Erbbaurecht","",""],["Altlasten / Baulasten","",""]];

class Component extends DCLogic {
  constructor(p){
    super(p);
    this.state={ u:UNTERLAGEN.map(function(x){return x[2];}), p:PUNKTE.map(function(x){return x[1];}), n:PUNKTE.map(function(x){return x[2];}) };
  }
  renderVals(){
    var self=this, s=this.state;
    function setU(i,w){ return function(){ var u=s.u.slice(); u[i]=w; self.setState({u:u}); }; }
    var unterlagen=UNTERLAGEN.map(function(x,i){
      var st=s.u[i];
      return { nr:i+1, name:x[0], pflicht:!!x[1], datei:st==='l'?x[3]:'', hakenKlasse:st==='l'?'an':'', nameKlasse:st==='l'?'erl':'',
        abhaken:setU(i, st==='l'?'f':'l'), setF:setU(i,'f'), setA:setU(i,'a'), setL:setU(i,'l'),
        kF:st==='f'?'f':'', kA:st==='a'?'a':'', kL:st==='l'?'l':'' };
    });
    var punkte=PUNKTE.map(function(x,i){
      var st=s.p[i];
      return { nr:UNTERLAGEN.length+i+1, name:x[0], notiz:s.n[i],
        hakenKlasse:st==='ok'?'an':(st==='krit'?'krit':''), nameKlasse:st==='ok'?'erl':'', krKlasse:st==='krit'?'an':'',
        abhaken:function(){ var p=s.p.slice(); p[i]=p[i]==='ok'?'':'ok'; self.setState({p:p}); },
        kritisch:function(){ var p=s.p.slice(); p[i]=p[i]==='krit'?'':'krit'; self.setState({p:p}); },
        setzeNotiz:function(e){ var n=s.n.slice(); n[i]=e.target.value; self.setState({n:n}); } };
    });
    var uE=s.u.filter(function(x){return x==='l';}).length, pE=s.p.filter(function(x){return x==='ok';}).length, k=s.p.filter(function(x){return x==='krit';}).length;
    var ges=UNTERLAGEN.length+PUNKTE.length;
    return { unterlagen:unterlagen, punkte:punkte, erledigt:uE+pE, gesamt:ges, fortschritt:Math.round((uE+pE)/ges*100)+'%',
      uErledigt:uE+' / '+UNTERLAGEN.length, pErledigt:pE+' / '+PUNKTE.length, hatKritisch:k>0, kritischText:k+' kritisch' };
  }
}
</script>
</body>
</html>
